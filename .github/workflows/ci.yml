name: ci
on: [push, pull_request]

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install declared dependencies
        run: pip install -r backend/requirements.txt
      # Guards the 2026-08-29 outage class: an undeclared import kills every
      # serverless invocation; the guard now covers backend/app AND
      # backend/tests (the Pillow/numpy CI failure was a test-only import).
      - name: Runtime import coverage check
        run: PYTHONPATH=. python3 backend/scripts/check_runtime_imports.py
      - name: Dependency security audit (pip-audit)
        run: pip install pip-audit && pip-audit -r backend/requirements.txt
      - name: Test suite
        run: PYTHONPATH=. python3 -m pytest backend/tests -q

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies (locked)
        working-directory: frontend
        run: npm ci
      # build runs `tsc && vite build` — a type error or a broken production
      # build fails the gate here, before merge.
      - name: Type-check + production build
        working-directory: frontend
        run: npm run build
      # Unit suite (vitest + jsdom): view-model/query-client behavior gates —
      # e.g. the B2B silent-fallback regressions (2026-09-04). Previously this
      # suite existed in-tree but was never executed by any workflow, so its
      # assertions silently rotted.
      - name: Unit tests (vitest)
        working-directory: frontend
        run: CI=1 npm test
      - name: Dependency security audit (npm audit)
        working-directory: frontend
        run: npm audit --audit-level=high
