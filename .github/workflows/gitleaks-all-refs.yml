name: gitleaks-all-refs

# CYCLE 11 (2026-09-07): the push/PR gitleaks job scans the history reachable
# from HEAD only. Delta-audit finding: a LIVE Modal token id sat in a public
# unmerged branch (final-no-excuses-release-gate) — and, worse, in main's OWN
# history at 4edc171a in a later-deleted file — completely invisible to the
# existing "full history" check because no default rule knows the provider's
# token format. The format rules now live in .gitleaks.toml; this workflow
# closes the REACH blind spot: it scans every commit reachable from ANY
# branch ref, on a weekly schedule (scheduled workflows run on the default
# branch) and on demand.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  scan:
    name: gitleaks secret scan (all refs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history of the checked-out ref
      - name: Fetch every branch ref
        # checkout only fetches the current ref; bring in ALL remote branch
        # heads so `--log-opts=--all` really covers them.
        run: git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: All-refs scan (every commit reachable from any branch)
        id: scan
        # Never abort the job here: the fail-closed guard below must run even
        # when leaks are found (same contract as gitleaks.yml).
        run: |
          set -o pipefail
          set +e
          gitleaks detect --source . --config .gitleaks.toml --redact -v --exit-code 1 \
            --log-opts="--all" \
            --report-format json --report-path /tmp/gitleaks-report.json 2>&1 | tee /tmp/gitleaks.log
          echo "gitleaks_exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Fail closed unless ALL refs were really scanned
        # Same anti-blindness guard as gitleaks.yml, recomputed over --all.
        run: |
          expected=0
          for c in $(git rev-list --no-merges --all); do
            if git diff-tree --no-commit-id -r --root --diff-filter=d --numstat "$c" \
                 | grep -vqE '^-[[:space:]]+-[[:space:]]-'; then
              expected=$((expected+1))
            fi
          done
          scanned=$(grep -oE '[0-9]+ commits scanned' /tmp/gitleaks.log | grep -oE '^[0-9]+' | tail -1)
          echo "history(--all, scannable)=$expected scanned=${scanned:-<none>}"
          if [ -z "$scanned" ]; then
            echo "::error::gitleaks did not report a scanned-commit count — treating as NOT scanned"; exit 1
          fi
          if [ "$scanned" -lt 1 ]; then
            echo "::error::gitleaks scanned 0 commits — the scan is blind, refusing to pass"; exit 1
          fi
          if [ "$expected" -lt 1 ]; then
            echo "::error::git history has no scannable commits — fetch is shallow or broken"; exit 1
          fi
          if [ "$scanned" -lt "$expected" ]; then
            echo "::error::gitleaks scanned $scanned commits but --all refs have $expected scannable commits — not a full all-refs scan"; exit 1
          fi
          echo "all refs scanned ($scanned commits, >= $expected reachable from every branch)"
      - name: Report leaks
        run: |
          if [ "${{ steps.scan.outputs.gitleaks_exit }}" != "0" ]; then
            echo "::error::gitleaks found secrets reachable from ANY branch (see redacted log above)"
            exit 1
          fi
          echo "no leaks found across all refs"
