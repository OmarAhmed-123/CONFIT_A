title = "CONFIT gitleaks config"

# Extend the default ruleset, then add what defaults miss and silence the
# documentation-only false positives found in the first full-history scan.
[extend]
useDefault = true

# Database connection strings with embedded credentials (the Neon incident
# of commit 6a821de was NOT caught by default rules — this rule exists so the
# next postgres/mysql DSN with a real password IS caught).
[[rules]]
id = "database-dsn-with-password"
description = "Database connection string containing an embedded password"
regex = '''(?i)(?:postgres(?:ql)?|mysql|mariadb|mongodb(?:\+srv)?|redis):\/\/[^:\s\/]+:[^@\s]{6,}@'''
keywords = ["://"]
  [rules.allowlist]
  description = "placeholders and the local-only docker-compose dev password"
  regexes = [
    '''YOUR_PASSWORD''',
    '''CHANGE_PASSWORD''',
    '''CHANGE_USER''',
    '''CHANGE_ME''',
    '''confit_secure_password_2026''',
    '''\$\{POSTGRES_PASSWORD''',
  ]

[allowlist]
description = "Documentation examples that are not real credentials"
# Truncated JWT header example in feature specs and the idempotency-key doc
# example — both flagged in the initial scan, both are illustrative only.
regexes = [
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9''',
  '''idemp_882190fa''',
  '''YOUR_PASSWORD''',
  '''CHANGE_ME''',
  '''CHANGE_PASSWORD''',
  '''CHANGE_USER''',
  '''confit_secure_password_2026''',  # historical local docker-compose dev DB value (no longer in the tree)
  '''\$\{POSTGRES_PASSWORD''',   # docker-compose variable interpolation, not a value
  '''refunds/cancellations''',
  '''refunds and cancellations''',
  # ---------------------------------------------------------------------
  # The Neon DSN embedded in backend/app/core/database.py history (added in
  # 6a821de, variants in b49ab27/878e649, removed in 70ccebc) was the only
  # REAL secret ever exposed by this repository. The password was ROTATED in
  # the Neon console on 2026-09-04, so the historical string is a dead
  # credential. Allowlisting is anchored on the fixed endpoint + user (never
  # the secret itself, so this file stores no credential of any state), per
  # the note that previously lived at the end of this section: "After
  # rotation, add the dead string here with a comment recording the
  # rotation date."
  #
  # Residual-risk note (truthful): a FUTURE leak of a *different* password
  # for the same user@endpoint would be suppressed by this pattern. The
  # permanent fix is history rewriting (git filter-repo + force-push +
  # rotation), which is intentionally NOT done here because force-pushing
  # shared main history is more destructive than the residual risk. Rotate
  # on any suspicion and audit Neon access logs.
  # ---------------------------------------------------------------------
  '''neondb_owner:npg_[^@]*@ep-frosty-term-b2ivqwuz''',
]

# ---------------------------------------------------------------------------
# CYCLE 11 (2026-09-07): provider token formats this project actually uses.
# Evidence: a LIVE Modal token-id sat in a PUBLIC unmerged branch
# (final-no-excuses-release-gate, FINAL_PRODUCTION_REPORT.md) and the
# default ruleset over --all refs found NOTHING — these formats have no
# default rule. Each rule below is anchored on the provider's documented
# token prefix, never on any secret value.
# ref: https://modal.com/docs/guide/modal-tokens (ak-… token id / as-… secret)
# ref: https://vercel.com/docs/accounts/create-access-token (vcp_…)
# ref: https://console.groq.com/docs/api-keys (gsk_…)
# ref: https://ai.google.dev/gemini-api-docs/api-key (AIza… / AQ.…) — no
#      default gitleaks rule covers the newer AQ. format.
# Fine-grained GitHub PATs (github_pat_) ARE covered by default rules since
# 8.21; no duplicate rule added.
# ---------------------------------------------------------------------------
[[rules]]
id = "modal-token"
description = "Modal token id (ak-) or token secret (as-)"
regex = '''\b(?:a[ks]-)[A-Za-z0-9]{16,}\b'''
keywords = ["ak-", "as-"]
  [[rules.allowlists]]
  # CYCLE 11 — known-exposure entry, ROTATION PENDING OWNER ACTION. The Modal
  # token id ak-Gc9… (full value never written in this file) was committed at
  # 4edc171a (FINAL_PRODUCTION_REPORT.md, 2026-09-02; file later deleted —
  # value still reachable in main history and on branch
  # final-no-excuses-release-gate). Tracked as an owner blocker since cycle 5.
  # The id alone cannot authenticate (Modal requires the id + secret pair; the
  # as- secret half was never committed). This suppresses ONLY this documented
  # exposure so the rule keeps catching every other Modal token; the launch
  # gate stays NO-GO until rotation is proven. Residual risk: a future token
  # whose id also starts ak-Gc9 would be missed — acceptable for one
  # documented pending-rotation credential.
  regexes = ['''ak-Gc9[A-Za-z0-9]*''']

[[rules]]
id = "vercel-access-token"
description = "Vercel access token (vcp_)"
regex = '''\bvcp_[A-Za-z0-9]{20,}\b'''
keywords = ["vcp_"]

[[rules]]
id = "groq-api-key"
description = "Groq API key (gsk_)"
regex = '''\bgsk_[A-Za-z0-9]{20,}\b'''
keywords = ["gsk_"]

[[rules]]
id = "gemini-api-key-aq"
description = "Gemini API key (AQ. format)"
regex = '''\bAQ\.[A-Za-z0-9_\-]{20,}\b'''
keywords = ["AQ."]
