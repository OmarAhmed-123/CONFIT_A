# CONFIT Alembic configuration.
#
# Retires `Base.metadata.create_all()` as the schema-management mechanism.
# The baseline migration (0001) captures the current schema explicitly; the
# remediation migration (0002) adds the Group 1 tables and the Group 2
# share-token hardening.
#
# The database URL is NEVER stored here. env.py resolves it in this order:
#   1. ALEMBIC_DATABASE_URL environment variable (migrations/tests)
#   2. -x dburl=... command-line override
#   3. the application's configured DATABASE_URL (backend/app/core/config.py)
#
# Run:  PYTHONPATH=. alembic -c backend/alembic.ini upgrade head
[alembic]
script_location = backend/alembic
prepend_sys_path = .
sqlalchemy.url =
version_path_separator = os
timezone = UTC

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
