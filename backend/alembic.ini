[alembic]
# CONFIT Alembic configuration — Group 1 §40.
#
# Retires `Base.metadata.create_all()` as the schema-management
# mechanism. The initial baseline migration (0001) captures the
# current schema (users, brand_profiles, audit_logs, catalog, wardrobe,
# commerce, tryon, stylist, brand_analytics, user_style_profiles).
# Migration 0002 adds the Group 1 tables (refresh_tokens,
# password_reset_tokens, email_verification_tokens, mfa_backup_codes,
# mood_boards, mood_board_items, User.oauth_provider/oauth_subject,
# UserStyleProfile consent columns).
#
# Run:  PYTHONPATH=. alembic -c backend/alembic.ini upgrade head
script_location = backend/alembic
sqlalchemy.url = sqlite:///./backend/data/confit.db
prepend_sys_path = .
version_path_separator = os
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
