# CONFIT Alembic configuration (G2-S1).
#
# The database URL is NEVER stored here. env.py resolves it in this order:
#   1. ALEMBIC_DATABASE_URL environment variable (migrations/tests)
#   2. -x dburl=... command-line override
#   3. the application's configured DATABASE_URL (backend/app/core/config.py)
[alembic]
script_location = backend/alembic
prepend_sys_path = .
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
